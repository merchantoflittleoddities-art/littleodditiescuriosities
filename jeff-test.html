<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeff the Land Shark — Easter Egg Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1625;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 32px;
      text-align: center;
      max-width: 320px;
      position: relative;
      z-index: 1;
    }

    .tier-icon {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: rgba(197, 161, 90, 0.16);
      font-size: 1.8rem;
      margin: 0 auto 20px;
      position: relative;
    }

    .jeff-trigger {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: none;
      border: none;
      padding: 0;
      font-size: 0.6rem;
      line-height: 1;
      color: rgba(197, 161, 90, 0.45);
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s ease;
    }

    .jeff-trigger:hover {
      opacity: 1;
    }

    h3 {
      color: #f0e6d3;
      font-size: 1.25rem;
      margin-bottom: 8px;
    }

    p {
      color: rgba(240, 230, 211, 0.7);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 24px;
      border-radius: 999px;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 0.95rem;
      transition: transform 0.2s ease, background-color 0.2s ease;
      text-decoration: none;
    }

    .button-primary {
      background: #c5a15a;
      color: #111;
    }

    .button-primary:hover {
      transform: translateY(-1px);
      background: #d4b46a;
    }

    .reset-btn {
      margin-top: 16px;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
      color: #f0e6d3;
    }

    .reset-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* Jeff Animation Container */
    .jeff-stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
      overflow: hidden;
    }

    .jeff {
      position: absolute;
      bottom: 0;
      left: -200px;
      width: 180px;
      height: 180px;
      background: url('jeff-reference.png') center/contain no-repeat;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));
      will-change: transform;
    }

    .jeff.active {
      animation: jeffSwim 4.5s ease-in-out forwards;
    }

    @keyframes jeffSwim {
      0% {
        transform: translate(-120vw, 0) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      12% {
        opacity: 1;
      }
      25% {
        transform: translate(20vw, 30px) rotate(-5deg) scale(1);
      }
      40% {
        transform: translate(35vw, -15px) rotate(3deg) scale(1);
      }
      50% {
        transform: translate(40vw, 10px) rotate(-2deg) scale(1);
      }
      60% {
        transform: translate(40vw, -10px) rotate(-3deg) scale(1);
      }
      70% {
        transform: translate(40vw, 15px) rotate(2deg) scale(1);
      }
      80% {
        transform: translate(40vw, -5px) rotate(0deg) scale(1);
      }
      90% {
        transform: translate(60vw, -10px) rotate(5deg) scale(0.95);
        opacity: 1;
      }
      100% {
        transform: translate(120vw, 0) rotate(0deg) scale(0.9);
        opacity: 0;
      }
    }

    .jeff.wiggle {
      animation: jeffWiggle 0.4s ease-in-out;
    }

    @keyframes jeffWiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }

    .status {
      margin-top: 12px;
      font-size: 0.85rem;
      color: rgba(240, 230, 211, 0.5);
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tier-icon">
      🌲
      <button class="jeff-trigger" type="button" aria-label="Hidden Artifacts secret">✦</button>
    </div>
    <h3>Hidden Artifacts</h3>
    <p>Rare discoveries with extra secrets hidden inside.</p>
    <a class="button button-primary" href="tiers.html?tier=Hidden%20Artifacts">Discover</a>
    <div>
      <button class="button reset-btn" id="resetBtn">Reset Animation</button>
    </div>
    <div class="status" id="status">Click the ✦ to summon Jeff</div>
  </div>

  <div class="jeff-stage" id="jeffStage">
    <div class="jeff" id="jeff"></div>
  </div>

  <script>
    const jeff = document.getElementById('jeff');
    const status = document.getElementById('status');
    const resetBtn = document.getElementById('resetBtn');
    let isAnimating = false;

    function summonJeff() {
      if (isAnimating) return;
      isAnimating = true;
      status.textContent = 'Jeff is swimming...';

      jeff.classList.remove('active', 'wiggle');
      void jeff.offsetWidth; // force reflow
      jeff.classList.add('active');

      jeff.addEventListener('animationend', function handler() {
        jeff.removeEventListener('animationend', handler);
        status.textContent = 'Jeff swam away. Click ✦ again!';
        isAnimating = false;
      });
    }

    function resetAnimation() {
      jeff.classList.remove('active', 'wiggle');
      status.textContent = 'Animation reset. Click the ✦ to summon Jeff';
      isAnimating = false;
    }

    document.querySelectorAll('.jeff-trigger').forEach((trigger) => {
      trigger.addEventListener('click', (event) => {
        event.preventDefault();
        summonJeff();
      });
    });

    resetBtn.addEventListener('click', resetAnimation);
  </script>
</body>
</html>
