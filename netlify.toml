# Netlify configuration for Little Oddities Curiosities

[build]
  # Run npm install so the stripe package is available to Netlify Functions
  command   = "npm install"

  # Serve the root directory as the published site
  publish   = "."

  # Netlify Functions live here
  functions = "netlify/functions"

[[redirects]]
  from   = "/data/featured-treasure.json"
  to     = "/.netlify/functions/get-featured-treasure"
  status = 200
  force  = true

[[redirects]]
  from   = "/data/desk-entries.json"
  to     = "/.netlify/functions/get-desk-entries"
  status = 200
  force  = true

